# Netlify configuration for React + Vite app
[build]
  # Build command
  command = "npm run build"

  # Directory with the build output (Vite default)
  publish = "dist"

  # Set Node.js version
  environment = { NODE_VERSION = "18" }

# Redirect rules for single-page application (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
