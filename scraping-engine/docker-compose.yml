version: '3.8'

services:
  scraping-engine:
    build: .
    container_name: scraping-engine
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - MONGODB_URI=mongodb://mongodb:27017
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
      - mongodb
    networks:
      - scraping-network

  redis:
    image: redis:7-alpine
    container_name: scraping-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - scraping-network
    command: redis-server --appendonly yes

  postgres:
    image: postgres:15-alpine
    container_name: scraping-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=scraping
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - scraping-network

  mongodb:
    image: mongo:7
    container_name: scraping-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - scraping-network

  prometheus:
    image: prom/prometheus:latest
    container_name: scraping-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - scraping-network

  grafana:
    image: grafana/grafana:latest
    container_name: scraping-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - scraping-network

networks:
  scraping-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  mongodb-data:
  prometheus-data:
  grafana-data:
